name: Build and deploy itinerary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet pillow
      - name: Cache photos
        uses: actions/cache@v4
        with:
          path: img
          key: commons-photos-${{ hashFiles('imgs2.json') }}
      - name: Download Wikimedia Commons photos
        run: python fetch_images.py
      - name: Build site
        run: |
          mkdir -p site
          cp -r img site/img
          python render.py local img site/index.html
          python render.py inline img site/standalone.html
          cp site/index.html site/404.html
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
